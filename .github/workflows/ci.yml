name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jonaprieto/precommit-lean/.github/actions/precommit@v0.1.6
        with:
          token: ${{ secrets.ECOSYSTEM_READ_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Authenticate private repositories
        env:
          ECOSYSTEM_READ_TOKEN: ${{ secrets.ECOSYSTEM_READ_TOKEN }}
        run: |
          test -n "$ECOSYSTEM_READ_TOKEN"
          git config --global url."https://x-access-token:$ECOSYSTEM_READ_TOKEN@github.com/".insteadOf "https://github.com/"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build-args: "calc"
